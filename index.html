<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ECEEF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1317" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Železná kniha">
<title>Železná kniha</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: mobile-first tréninkový deník, spodní navigace, jedna karta = jedna obrazovka.
   Barvy: chladná betonová šeď + inkoustová čerň + signální kobalt (kotouč na čince). */
:root{
  --bg:#ECEEF1; --surface:#F8F9FA; --surface2:#E2E5E9; --line:#CDD2D8;
  --fg:#14181D; --muted:#5C6672; --accent:#2749E8; --accent-fg:#fff; --accent-soft:#DCE3FF;
  --ok:#1E8A52; --warn:#B26A00; --warn-fg:#fff; --bad:#C3342B;
  --f-display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1317; --surface:#181D23; --surface2:#222930; --line:#2E3640;
  --fg:#E8ECF0; --muted:#8D98A5; --accent:#7F9AFF; --accent-fg:#0B1030; --accent-soft:#222C55;
  --ok:#4CC38A; --warn:#E6A23C; --warn-fg:#1B1200; --bad:#F0736B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1317; --surface:#181D23; --surface2:#222930; --line:#2E3640;
  --fg:#E8ECF0; --muted:#8D98A5; --accent:#7F9AFF; --accent-fg:#0B1030; --accent-soft:#222C55;
  --ok:#4CC38A; --warn:#E6A23C; --warn-fg:#1B1200; --bad:#F0736B; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:400 16px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:env(safe-area-inset-top,0px) 96px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:40px;text-transform:uppercase}
h2{font-size:26px;text-transform:uppercase}
h3{font-size:20px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px;padding-top:20px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;min-width:0}
.top small{font:600 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lbl{font:700 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
.grow{flex:1 1 auto;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;font-weight:600;min-height:44px}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.btn.bad{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:default}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;min-height:40px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field input,.field select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.tag.chg{background:var(--warn);color:var(--warn-fg)}
.tag{font:700 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);padding:3px 8px;border-radius:4px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav button{border:0;background:transparent;padding:8px 2px;border-radius:8px;font:700 13px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-height:48px}
.nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.ex{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:start}
.ex h3{overflow-wrap:anywhere}
.sets{display:grid;gap:8px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:8px;align-items:center}
.set input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:44px;width:100%;text-align:center;font-family:var(--f-mono)}
.set .n{font:700 14px var(--f-mono);color:var(--muted);text-align:center}
.set .done{border:1px solid var(--line);background:var(--bg);border-radius:8px;min-height:44px;font-size:20px;font-weight:700}
.set.ok .done{background:var(--ok);border-color:var(--ok);color:#fff}
.set.ok input{border-color:var(--ok)}
.timer{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:15;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.timer .btn{background:transparent;color:var(--bg);border-color:var(--bg)}
.timer .btn:hover{background:rgba(127,127,127,.25)}
.timer .t{font:800 34px var(--f-mono);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.stat b{display:block;font:800 30px var(--f-display);line-height:1.1}
.mach{font-size:14px;color:var(--muted)}
.mach b{color:var(--fg);font-weight:600}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);width:min(560px,calc(100% - 24px));max-height:86vh;padding:0}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dlg{padding:16px;display:flex;flex-direction:column;gap:12px;max-height:84vh;overflow:auto}
.pick{display:flex;flex-direction:column;gap:8px}
.pickitem{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:52px}
.pickitem span{min-width:0}
.pickitem em{display:block;font-style:normal;font-size:13px;color:var(--muted)}
.chartbox{overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:40;font-weight:600;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .25s}}
@media (max-width:400px){h1{font-size:34px}.set{grid-template-columns:24px 1fr 1fr 44px;gap:6px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<input type="file" id="impfile" accept=".json,application/json" hidden>
<script src="config.js"></script>
<script src="js/data.js"></script>
<script src="js/equipment.js"></script>
<script src="js/storage.js"></script>
<script src="js/core.js"></script>
<script src="js/views-home.js"></script>
<script src="js/views-plans.js"></script>
<script src="js/views-lib-hist.js"></script>
<script src="js/coach.js"></script>
<script src="js/settings.js"></script>
<script src="js/events.js"></script>
</body>
</html>
